<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucles en JS</title>
    <meta name="author" content="Vicente Valdebenito">
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <div class="contenedor">
        <h1>Práctica de Bucles</h1>
        <div class="card">
            <h2>Ejercicio 1</h2>
            <p>Bucle for - Contar Hasta 5</p>
            <button onclick="contarHasta5()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejercicio 2</h2>
            <p>Bucle for - Recorrer Lista</p>
            <button onclick="recorrerLista()">Ejecutar</button>
        </div>
        <hr>
        <div class="card">
            <h2>Ejercicio 3</h2>
            <p>Bucle while - Reproducir Cancion</p>
            <button onclick="reproducirCancion()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejercicio 4</h2>
            <p>Bucle while - Carga de datos</p>
            <button onclick="cargarDatos()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejercicio 5</h2>
            <p>Bucle while - Validar Contraseña</p>
            <button onclick="validarContrasena()">Ejecutar</button>
        </div>
    </div>

    <script src="static/js/script.js"></script>

</body>

</html>
